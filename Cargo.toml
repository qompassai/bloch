[package]
name = "blochs"
version = "0.1.0"
edition = "2021"
description = "Ranked, budgeted codebase maps for coding agents with session handoff fidelity"
license = "Apache-2.0"
repository = "https://github.com/qompassai/bloch"
homepage = "https://github.com/qompassai/bloch"
documentation = "https://docs.rs/bloch"
readme = "README.md"
keywords = ["codebase", "agents", "mapping", "tree-sitter", "handoff"]
categories = ["development-tools"]
authors = ["Matt Porter <map@qompass.ai>"]
exclude = [".github/"]

[lib]
name = "bloch"
path = "src/lib.rs"

[[bin]]
name = "bloch"
path = "src/main.rs"

[dependencies]
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-lua = "0.2"
tree-sitter-python = "0.23"
tree-sitter-nix = "0.3"
tree-sitter-md = "0.5"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-bash = "0.23"
tree-sitter-typescript = "0.23"
walkdir = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "1"
scip = "0.10.0"
protobuf = "3.7.2"
