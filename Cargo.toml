[package]
name = "blochs"
version = "0.4.0"
edition = "2021"
description = "Ranked, budgeted codebase maps for coding agents with session handoff fidelity"
license = "Apache-2.0"
repository = "https://github.com/qompassai/bloch"
homepage = "https://github.com/qompassai/bloch"
documentation = "https://docs.rs/bloch"
readme = "README.md"
keywords = ["codebase", "agents", "mapping", "tree-sitter", "handoff"]
categories = ["development-tools"]
authors = ["Matt Porter <map@qompass.ai>"]
exclude = [".github/"]

[lib]
name = "bloch"
path = "src/lib.rs"

[[bin]]
name = "bloch"
path = "src/main.rs"

[dependencies]
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-lua = "0.2"
tree-sitter-python = "0.23"
tree-sitter-nix = "0.3"
tree-sitter-md = "0.5"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-bash = "0.23"
tree-sitter-typescript = "0.23"
walkdir = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rmcp is pinned to the fleet version (D-113 standardization): one
# SDK version across every estate server; bumps are single fleet
# events. As of 0.4.0 the server speaks the modern protocol era
# only (2026-07-28); see src/guard.rs. D-113 explicitly overrides
# this crate's former no-new-deps rule for the server module; the
# CLI's synchronous paths gain no async dependency surface.
rmcp = { version = "=3.8.0", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time"] }
clap = { version = "4", features = ["derive"] }
thiserror = "1"
scip = "0.10.0"
protobuf = "3.7.2"
