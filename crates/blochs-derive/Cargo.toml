[package]
name = "blochs-derive"
version = "0.1.0"
edition = "2021"
description = "Compile-time MCP tool declarations and refusal codes"
license = "Apache-2.0"

[lib]
name = "mcp_derive"
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
serde_json = "1"
trybuild = "1"
